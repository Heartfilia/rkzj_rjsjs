# 软考刷题 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/ruankao.conf
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 使用顺序：
#   1. 先用这份配置，让域名能通过 HTTP 访问
#   2. 再运行：sudo certbot --nginx -d rk.example.com
#      certbot 会自动补上 443 监听、HTTPS 跳转和自动续期
#
# 静态文件直接在 Nginx 出，只有 /api/ 反代给 Python 服务。

server {
    listen      80;
    listen      [::]:80;
    server_name rk.example.com;

    root  /opt/ruankao/server/web;
    index index.html;

    access_log /var/log/nginx/ruankao.access.log;
    error_log  /var/log/nginx/ruankao.error.log;

    # 不想被搜索引擎索引——公网可被抓取和"小范围自用"是两回事
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 首屏题库索引 gzip 约 10 KB，题目正文按需返回；这里主要压 html/css/js
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/html text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # 首次拉取题库要读 2 MB，给宽一点
        proxy_read_timeout    60s;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
